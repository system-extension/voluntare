# Compila o backend e roda os testes (inclusive os do banco, com PostgreSQL em contêiner via Testcontainers)
# a cada PR e a cada push na develop e na main.
name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read

# Um PR novo cancela a execução anterior do mesmo PR
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # O runner do GitHub já tem Docker, que o Testcontainers usa para subir o PostgreSQL
      - run: ./mvnw -B verify
