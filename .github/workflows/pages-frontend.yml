# Publica o frontend (pasta frontend/) no GitHub Pages a cada push na develop.
# Endereço: https://system-extension.github.io/voluntare/
name: Pages do frontend

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-frontend.yml'
  workflow_dispatch: # permite publicar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez; uma nova cancela a que ainda estiver na fila
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # O site fica em /voluntare/, não na raiz do domínio
      - run: npm run build
        env:
          VITE_BASE: /voluntare/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
