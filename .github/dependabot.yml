# Mantém as actions dos workflows atualizadas. Uma vez por mês o Dependabot confere se saiu
# versão nova de checkout, setup-java, setup-node etc. e abre um único PR para a develop com
# todas as trocas (o CI roda nesse PR antes do merge). Evita voltar a usar versões descontinuadas,
# como aconteceu com as que rodavam em Node 20.
# O GitHub lê este arquivo da branch padrão (main): passa a valer quando a develop chegar lá.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
