# Ambiente local, na raiz do repositório:
#   docker compose up -d                        sobe só o PostgreSQL (backend e front rodam na máquina)
#   docker compose --profile app up -d --build  sobe tudo: banco, backend (8080) e front (5173)
# nome fixo do projeto: rodar de outra pasta reaproveita os mesmos contêineres
name: voluntare

services:
  postgres:
    image: postgres:16-alpine
    container_name: voluntare-postgres
    environment:
      POSTGRES_DB: voluntare
      POSTGRES_USER: voluntare
      POSTGRES_PASSWORD: voluntare
    # Porta no host: 5432 por padrão. Se a máquina já tiver um PostgreSQL nessa porta,
    # defina DB_PORT (ex.: 5433); o backend lê a mesma variável.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - voluntare-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voluntare -d voluntare"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [app]
    build: ./backend
    container_name: voluntare-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/voluntare
      DB_USER: voluntare
      DB_PASSWORD: voluntare
      CORS_ORIGENS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: [app]
    build: ./frontend
    container_name: voluntare-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  voluntare-dados:
