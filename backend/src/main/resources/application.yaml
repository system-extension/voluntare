spring:
  application:
    name: voluntare

  # Valores padrão batem com o compose.yaml. Em outro ambiente, sobrescreva pelas variáveis.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/voluntare}
    username: ${DB_USER:voluntare}
    password: ${DB_PASSWORD:voluntare}

  jpa:
    # O schema é responsabilidade do Flyway (D-05). O Hibernate só confere se as entidades batem com ele.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Coleções e relações LAZY são carregadas em lotes (WHERE id IN (...)), não uma consulta por linha.
        # Ex.: as habilidades das 15 vagas de uma página da busca saem numa consulta só.
        default_batch_fetch_size: 50

  flyway:
    locations: classpath:db/migration

# Token de login (JWT). Em qualquer ambiente fora da máquina local, defina JWT_SEGREDO
# com no mínimo 32 caracteres aleatórios. O padrão abaixo serve só para desenvolvimento.
voluntare:
  jwt:
    segredo: ${JWT_SEGREDO:voluntare-dev-segredo-local-nao-usar-em-producao}
    validade: 8h
