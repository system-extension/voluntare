server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # o front chama /api no mesmo endereço; o nginx repassa para o backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # sem o Origin o Spring trata como mesma origem, igual ao proxy do npm run dev
        proxy_set_header Origin "";
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # rotas do React caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
